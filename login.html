<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce Website — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <div class="container">
      <h1 class="page-title" data-i18n="login.title">Login</h1>
      <div class="form-card">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email" data-i18n="login.email">Email</label>
            <input id="email" type="email" required autocomplete="email" />
            <p class="form-error" id="email-error" hidden></p>
          </div>
          <div class="form-group">
            <label for="password" data-i18n="login.password">Password</label>
            <input id="password" type="password" required autocomplete="current-password" minlength="4" />
            <p class="form-error" id="password-error" hidden></p>
          </div>
          <button class="btn btn--primary" type="submit" data-i18n="login.submit">Sign in</button>
        </form>
        <p class="form-meta"><span data-i18n="login.noAccount">No account?</span> <a href="signup.html" data-i18n="header.signup">Sign Up</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <div class="whatsapp-float" id="whatsapp-float"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      let ok = true;

      function showErr(id, msg) {
        const el = document.getElementById(id);
        el.hidden = !msg;
        el.textContent = msg || "";
      }

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      showErr("email-error", emailOk ? "" : (getLang() === "bn" ? "সঠিক ইমেইল দিন" : "Enter a valid email"));
      if (!emailOk) ok = false;

      showErr("password-error", password.value.length >= 4 ? "" : (getLang() === "bn" ? "কমপক্ষে ৪ অক্ষর" : "At least 4 characters"));
      if (password.value.length < 4) ok = false;

      if (!ok) return;

      const existing = getUser();
      setUser({
        email: email.value.trim(),
        name: (existing && existing.email === email.value.trim() && existing.name) || email.value.trim().split("@")[0],
      });
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
