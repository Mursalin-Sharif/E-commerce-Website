<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce Website — Category</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <div class="container">
      <h1 class="page-title" id="category-title">Category</h1>
      <p class="page-lead" id="category-lead"></p>
      <div class="product-grid" id="product-grid"></div>
      <p class="empty-state" id="empty-state" hidden data-i18n="category.empty">No products in this category yet.</p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <div class="whatsapp-float" id="whatsapp-float"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script>
    function renderCategory() {
      const params = new URLSearchParams(window.location.search);
      const catId = params.get("cat");
      const cat = getCategoryById(catId);
      const title = document.getElementById("category-title");
      const lead = document.getElementById("category-lead");
      const grid = document.getElementById("product-grid");
      const empty = document.getElementById("empty-state");

      grid.innerHTML = "";

      if (!cat) {
        title.textContent = getLang() === "bn" ? "ক্যাটাগরি পাওয়া যায়নি" : "Category not found";
        lead.textContent = getLang() === "bn" ? "মেনু থেকে একটি ক্যাটাগরি বেছে নিন।" : "Pick a category from the menu.";
        empty.hidden = false;
        return;
      }

      title.textContent = categoryLabel(cat);
      lead.textContent =
        getLang() === "bn"
          ? "এই ক্যাটাগরির উপলব্ধ পণ্য।"
          : "Available products in this category.";

      const products = getProductsByCategory(cat.id);
      if (!products.length) {
        empty.hidden = false;
        return;
      }

      empty.hidden = true;
      products.forEach((p) => grid.appendChild(createProductCard(p, { animate: true })));
      productAnimInitialized = false;
      requestAnimationFrame(() => initProductScrollAnimations(true));
    }

    document.addEventListener("storeReady", renderCategory);
    document.addEventListener("langchange", renderCategory);
    if (STORE) renderCategory();
  </script>
  <script src="js/animations.js"></script>
</body>
</html>
